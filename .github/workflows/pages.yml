# Publica a versão estática do Screener no GitHub Pages a cada push na main.
# Ativa em Settings › Pages › Source: GitHub Actions.
# Chave da The Graph: a de testes incluída no código, ou o secret GRAPH_API_KEY se existir (opcional).
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js && node tools/build-web.js && node --check dist-web/engine.js
        env:
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
