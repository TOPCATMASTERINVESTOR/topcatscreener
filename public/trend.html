<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081426">
<link rel="icon" type="image/png" href="logo.png">
<title>Trend analysis · TopCat Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#081426; --panel:#0d1d36; --panel2:#132744; --line:#1f3657; --text:#e8f0fa; --muted:#8fa3bf;
  --accent:#0f6fd6; --teal:#1fd1b2; --good:#2fd39a; --warn:#fb923c; --bad:#ff5b6e; --blue:#5eb0ff;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans)}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
.wrap{max-width:1320px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:40px;height:40px;border-radius:10px}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
h1 small{display:block;font:500 13px var(--sans);color:var(--muted);letter-spacing:0;margin-top:2px}
h2{font-size:15px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 12px;font:600 13px var(--sans);cursor:pointer}
.btn:hover{text-decoration:none;border-color:#2c4c78}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
/* escolha do tipo: as duas figuras */
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.types{grid-template-columns:1fr}}
.type{position:relative;display:block;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px 10px;background:var(--bg);cursor:pointer;transition:border-color .15s}
.type:hover{border-color:#2c4c78}
.type.on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,209,178,.12)}
.type input{position:absolute;opacity:0;pointer-events:none}
.type .th{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.type .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--panel2);font:700 13px var(--mono)}
.type.on .num{background:var(--teal);color:#062018}
.type b{font-size:15px}
.type p{margin:6px 0 0;color:var(--muted);font-size:13px}
.type svg{width:100%;height:auto;display:block}
.type:focus-within{outline:2px solid var(--teal);outline-offset:2px}
/* sliders */
.sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px 30px}
.field{margin-bottom:12px}
.field.off{opacity:.38}
.t{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;font-weight:600}
.t em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.t span{text-transform:none;font-family:var(--mono);font-size:13px;color:var(--text)}
.rv{font:600 15px var(--mono);color:var(--teal);margin-bottom:6px}
.dual{position:relative;height:28px}
.dual .track{position:absolute;left:0;right:0;top:12px;height:4px;background:var(--line);border-radius:2px}
.dual .fill{position:absolute;top:12px;height:4px;background:var(--accent);border-radius:2px}
.dual input{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;border-radius:50%;background:#e8f0fa;border:3px solid var(--teal);cursor:pointer}
.dual input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#e8f0fa;border:3px solid var(--teal);cursor:pointer}
.dual input:disabled::-webkit-slider-thumb{cursor:not-allowed}
.ticks{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--muted);margin-top:2px}
.runbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px}
.go{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:12px 26px;background:var(--accent);color:#fff;font:700 16px var(--sans);cursor:pointer;box-shadow:0 6px 18px rgba(15,111,214,.35)}
.go:hover{filter:brightness(1.08)}
.sum{color:var(--muted);font-size:14px}
.sum b{color:var(--text)}
/* resultados */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);white-space:nowrap;vertical-align:middle}
.tbl th.l,.tbl td.l{text-align:left}
.tbl td.tok{font-family:var(--sans)}
.tbl td.tok b{display:block;font-size:15px}
.tbl td.tok span{color:var(--muted);font-size:12px}
.tbl tr:hover td{background:#10243f}
.nbig{font:700 22px/1 var(--mono);color:var(--teal)}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:220px;margin-left:auto}
.chips span{font:600 11px var(--mono);padding:2px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line)}
.cb{display:inline-block;font:600 11px var(--sans);padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.mini{display:block}
.dim{color:var(--muted)}
.pb{display:inline-block;margin-left:5px;font:600 10px/1.4 var(--mono);color:#f5cf4a;border:1px solid rgba(245,207,74,.5);border-radius:4px;padding:0 4px;cursor:help}
.tblbox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
@media (max-width:700px){ .tbl .hide-m{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="logo.png" alt=""><h1><span id="title">Trend analysis</span><small id="sub"></small></h1></div>
    <a class="btn" href="./" id="back"></a>
  </header>

  <section class="panel">
    <h2 id="h_type"></h2>
    <div class="types" role="radiogroup">
      <label class="type" id="type1"><input type="radio" name="ttype" value="1">
        <div class="th"><span class="num">1</span><b id="t1_name"></b></div>
        <svg viewBox="0 0 520 300" role="img" aria-labelledby="t1_name">
          <defs><marker id="arr" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#8fa3bf"/></marker></defs>
          <!-- guias verticais -->
          <g stroke="#3a5378" stroke-dasharray="3 4" stroke-width="1">
            <line x1="62" y1="38" x2="62" y2="262"/><line x1="190" y1="196" x2="190" y2="262"/><line x1="470" y1="70" x2="470" y2="262"/>
          </g>
          <!-- preço -->
          <polyline fill="none" stroke="#2fd39a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
            points="18,170 62,38 86,120 110,90 136,160 160,150 190,196 214,148 232,166 248,150 266,170 286,132 310,175 330,150 352,118 372,150 392,98 414,132 436,104 452,82 470,70"/>
          <!-- intervalos d: do máximo local ao regresso a esse nível -->
          <g stroke="#5eb0ff" stroke-width="2.4" stroke-linecap="round"><line x1="160" y1="150" x2="248" y2="150"/><line x1="286" y1="132" x2="342" y2="132"/><line x1="392" y1="98" x2="440" y2="98"/></g>
          <g fill="#5eb0ff" font="600 15px JetBrains Mono,monospace" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="15">
            <text x="204" y="140">d1</text><text x="314" y="122">d2</text><text x="416" y="88">dn</text></g>
          <g font-family="Archivo,sans-serif" font-weight="700" font-size="14">
            <text x="62" y="28" fill="#ff5b6e" text-anchor="middle">ATH</text>
            <text x="190" y="218" fill="#fb923c" text-anchor="middle">ATL</text>
            <text x="470" y="56" fill="#e8f0fa" text-anchor="middle" id="t1_price">Price</text></g>
          <!-- L1, L2, L -->
          <g stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)">
            <line x1="66" y1="244" x2="186" y2="244" stroke="#ff5b6e"/><line x1="194" y1="244" x2="466" y2="244" stroke="#2fd39a"/>
            <line x1="66" y1="272" x2="466" y2="272" stroke="#8fa3bf"/></g>
          <g font-family="JetBrains Mono,monospace" font-weight="700" font-size="14" text-anchor="middle">
            <text x="126" y="236" fill="#ff5b6e">L1</text><text x="330" y="236" fill="#2fd39a">L2</text><text x="266" y="292" fill="#e8f0fa">L</text></g>
        </svg>
        <p id="t1_desc"></p>
      </label>
      <label class="type" id="type2"><input type="radio" name="ttype" value="2">
        <div class="th"><span class="num">2</span><b id="t2_name"></b></div>
        <svg viewBox="0 0 520 300" role="img" aria-labelledby="t2_name">
          <g stroke="#3a5378" stroke-dasharray="3 4" stroke-width="1"><line x1="40" y1="232" x2="40" y2="262"/><line x1="480" y1="60" x2="480" y2="262"/></g>
          <polyline fill="none" stroke="#2fd39a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
            points="22,206 40,232 52,160 62,180 80,120 90,128 110,92 128,124 146,104 166,130 180,112 196,120 214,84 236,108 262,70 286,96 306,92 330,58 352,86 376,48 398,74 420,62 444,30 480,60"/>
          <g stroke="#5eb0ff" stroke-width="2.4" stroke-linecap="round"><line x1="110" y1="92" x2="206" y2="92"/><line x1="214" y1="84" x2="256" y2="84"/><line x1="262" y1="70" x2="322" y2="70"/><line x1="330" y1="58" x2="370" y2="58"/><line x1="376" y1="48" x2="430" y2="48"/></g>
          <g fill="#5eb0ff" font-family="JetBrains Mono,monospace" font-weight="700" font-size="15" text-anchor="middle">
            <text x="158" y="82">d1</text><text x="235" y="74">d2</text><text x="292" y="60">d3</text><text x="350" y="48">d4</text><text x="403" y="38">dn</text></g>
          <g font-family="Archivo,sans-serif" font-weight="700" font-size="14">
            <text x="40" y="226" fill="#fb923c" text-anchor="end" dx="-8">ATL</text>
            <text x="480" y="46" fill="#e8f0fa" text-anchor="middle" id="t2_price">Price</text></g>
          <line x1="44" y1="272" x2="476" y2="272" stroke="#8fa3bf" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
          <text x="260" y="292" fill="#e8f0fa" font-family="JetBrains Mono,monospace" font-weight="700" font-size="14" text-anchor="middle">L</text>
        </svg>
        <p id="t2_desc"></p>
      </label>
    </div>
  </section>

  <section class="panel">
    <h2 id="h_params"></h2>
    <div class="sliders">
      <div class="field" id="fL"><label class="t" for="L_lo"><span>L</span> <em id="lab_L"></em></label><div class="rv" id="L_v"></div>
        <div class="dual"><div class="track"></div><div class="fill" id="L_f"></div><input type="range" id="L_lo"><input type="range" id="L_hi"></div><div class="ticks"><span>1d</span><span>30d</span><span>1y</span><span>3y</span></div></div>
      <div class="field" id="fL1"><label class="t" for="L1_lo"><span>L1</span> <em id="lab_L1"></em></label><div class="rv" id="L1_v"></div>
        <div class="dual"><div class="track"></div><div class="fill" id="L1_f"></div><input type="range" id="L1_lo"><input type="range" id="L1_hi"></div><div class="ticks"><span>1d</span><span>30d</span><span>1y</span><span>3y</span></div></div>
      <div class="field" id="fL2"><label class="t" for="L2_lo"><span>L2</span> <em id="lab_L2"></em></label><div class="rv" id="L2_v"></div>
        <div class="dual"><div class="track"></div><div class="fill" id="L2_f"></div><input type="range" id="L2_lo"><input type="range" id="L2_hi"></div><div class="ticks"><span>1d</span><span>30d</span><span>1y</span><span>3y</span></div></div>
      <div class="field" id="fd"><label class="t" for="d_lo"><span>d</span> <em id="lab_d"></em></label><div class="rv" id="d_v"></div>
        <div class="dual"><div class="track"></div><div class="fill" id="d_f"></div><input type="range" id="d_lo"><input type="range" id="d_hi"></div><div class="ticks"><span>1d</span><span>30d</span><span>1y</span><span>3y</span></div></div>
    </div>
    <div class="runbar"><button class="go" id="run" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg><span id="run_t"></span></button><span class="sum" id="sum"></span></div>
    <div class="note" id="note"></div>
  </section>

  <section id="out"></section>
</div>
<script src="i18n.js"></script>
<script src="trendcore.js"></script>
<script>
const $=id=>document.getElementById(id);
const store={ get(k){ try{ return JSON.parse(localStorage.getItem('aths:'+k)); }catch{ return null; } }, set(k,v){ try{ localStorage.setItem('aths:'+k, JSON.stringify(v)); }catch{} } };
// dados: vêm da página do Screener que abriu esta tab (window.opener); cópia em localStorage para recarregar
let DATA=null;
try{ if(window.opener && window.opener.TREND_DATA) DATA=window.opener.TREND_DATA; }catch(_){}
if(DATA) store.set('trendData', DATA); else DATA=store.get('trendData');
const LANG=['en','es','ru','zh','pt'].includes((DATA&&DATA.lang)||store.get('lang')) ? ((DATA&&DATA.lang)||store.get('lang')) : 'en';
document.documentElement.lang = LANG==='zh'?'zh-CN':LANG;
function t(k,v){ let s=(I18N[LANG]&&I18N[LANG][k]) ?? I18N.en[k] ?? k; if(v) for(const [a,b] of Object.entries(v)) s=s.split('{'+a+'}').join(b); return s; }
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function price(n){ if(!(n>0)) return '—'; if(n>=1000) return '$'+n.toLocaleString('en',{maximumFractionDigits:0}); if(n>=1) return '$'+n.toFixed(n>=100?2:3);
  const z=Math.floor(-Math.log10(n)); if(z>=4){ const sub=String(z).split('').map(d=>'₀₁₂₃₄₅₆₇₈₉'[d]).join(''); return '$0.0'+sub+String(Math.round(n*10**(z+3))).slice(0,4); } return '$'+n.toPrecision(4); }

// textos
document.title=t('tr_title')+' · TopCat Screener';
$('title').textContent=t('tr_title'); $('back').textContent='← '+t('liq_back');
$('h_type').textContent=t('tr_h_type'); $('h_params').textContent=t('tr_h_params');
$('t1_name').textContent=t('tr_t1'); $('t2_name').textContent=t('tr_t2'); $('t1_desc').textContent=t('tr_t1_desc'); $('t2_desc').textContent=t('tr_t2_desc');
$('t1_price').textContent=t('tr_price'); $('t2_price').textContent=t('tr_price');
$('run_t').textContent=t('tr_run'); $('note').textContent=t('tr_note');

// escala dos sliders (dias)
const DAYS=[1,2,3,5,7,10,14,21,30,45,60,90,120,150,180,240,300,365,450,545,730,900,1095];
const fmtD=d=> d>=365 && d%365===0 ? (d/365)+'y' : d+'d';
const P0={ type:1, L:[30,1095], L1:[7,730], L2:[30,1095], d:[5,90] };
let P=Object.assign({}, P0, store.get('trendP')||{});
const near=v=>{ let best=0; DAYS.forEach((x,i)=>{ if(Math.abs(x-v)<Math.abs(DAYS[best]-v)) best=i; }); return best; };
const SL={};
function dual(k){
  const lo=$(k+'_lo'), hi=$(k+'_hi'), f=$(k+'_f'), v=$(k+'_v');
  [lo,hi].forEach(el=>{ el.min=0; el.max=DAYS.length-1; el.step=1; });
  lo.value=near(P[k][0]); hi.value = P[k][1]==null ? DAYS.length-1 : near(P[k][1]);   // máximo vazio = sem limite (fim da escala)
  lo.setAttribute('aria-label',k+' min'); hi.setAttribute('aria-label',k+' max');
  const upd=(src)=>{ let a=+lo.value, b=+hi.value; if(a>b){ if(src===lo) lo.value=a=b; else hi.value=b=a; }
    const pa=a/(DAYS.length-1)*100, pb=b/(DAYS.length-1)*100; f.style.left=pa+'%'; f.style.width=(pb-pa)+'%';
    P[k]=[DAYS[a], b===DAYS.length-1 ? null : DAYS[b]];
    v.textContent = DAYS[a]+' – '+(b===DAYS.length-1 ? DAYS[b]+'+' : DAYS[b])+' '+t('tr_days');
    store.set('trendP',P); };
  lo.addEventListener('input',()=>upd(lo)); hi.addEventListener('input',()=>upd(hi)); upd();
  SL[k]={lo,hi};
}
['L','L1','L2','d'].forEach(dual);
$('lab_L').textContent='';
function renderType(){
  for(const n of [1,2]){ const el=$('type'+n); el.classList.toggle('on', P.type===n); el.querySelector('input').checked = P.type===n; }
  $('lab_L').textContent = P.type===1 ? t('tr_L1x') : t('tr_L2x');
  $('lab_L1').textContent=t('tr_L1'); $('lab_L2').textContent=t('tr_L2'); $('lab_d').textContent=t('tr_d');
  for(const k of ['L1','L2']){ $('f'+k).classList.toggle('off', P.type!==1); SL[k].lo.disabled=SL[k].hi.disabled = P.type!==1; }
}
document.querySelectorAll('input[name="ttype"]').forEach(el=>el.addEventListener('change',()=>{ P.type=+el.value;
  if(P.type===2 && P.d[0]<10){ P.d=[10,P.d[1]]; SL.d.lo.value=near(10); SL.d.lo.dispatchEvent(new Event('input')); }   // figura 2: d ≥ 10 dias
  store.set('trendP',P); renderType(); }));
renderType();

// mini-gráfico: preço (escala log) desde o ATH (tipo 1) ou ATL (tipo 2), com os intervalos d
function mini(row, a){
  const W=240, H=58, c=row.hist.c, i0=a.chartFrom, i1=a.last; const seg=c.slice(i0,i1+1).map(x=>x>0?Math.log(x):null);
  const vals=seg.filter(x=>x!=null); if(vals.length<2) return '';
  const lo=Math.min(...vals), hi=Math.max(...vals), sx=i=>(i-i0)/(Math.max(1,i1-i0))*(W-4)+2, sy=v=>H-3-(v-lo)/(hi-lo||1)*(H-8);
  let d='', pen=false; seg.forEach((v,k)=>{ if(v==null){ pen=false; return; } d+=(pen?'L':'M')+sx(i0+k).toFixed(1)+' '+sy(v).toFixed(1); pen=true; });
  const inSet=new Set(a.counted);
  const lines=a.all.map(x=>{ const y=sy(Math.log(x.level)); return `<line x1="${sx(x.from).toFixed(1)}" y1="${y.toFixed(1)}" x2="${sx(x.to).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${inSet.has(x)?'#5eb0ff':'#3a5378'}" stroke-width="${inSet.has(x)?2:1}"/>`; }).join('');
  const atl=a.start>=i0 && c[a.start]>0 ? `<circle cx="${sx(a.start).toFixed(1)}" cy="${sy(Math.log(c[a.start])).toFixed(1)}" r="2.6" fill="#fb923c"/>` : '';
  return `<svg class="mini" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="#2fd39a" stroke-width="1.6" stroke-linejoin="round"/>${lines}${atl}</svg>`;
}

function run(){
  const rows=(DATA&&DATA.rows)||[];
  const res=[];
  for(const r of rows){ const a=TrendCore.analyze(r,P); if(a.ok) res.push({r,a}); }
  res.sort((x,y)=> y.a.n-x.a.n || (x.a.lastBreak??1e9)-(y.a.lastBreak??1e9) || (y.r.pctOfAth||0)-(x.r.pctOfAth||0));
  const withN=res.filter(x=>x.a.n>0);
  $('sum').innerHTML=t('tr_sum',{m:'<b>'+withN.length+'</b>', n:'<b>'+res.length+'</b>', t:rows.length});
  if(!withN.length){ $('out').innerHTML=`<div class="panel empty">${esc(t('tr_none'))}</div>`; return; }
  const head=`<tr><th>#</th><th class="l">${esc(t('tr_c_token'))}</th><th class="l hide-m">${esc(t('tr_c_chain'))}</th><th>n</th><th class="hide-m">${esc(t('tr_c_ds'))}</th><th class="hide-m">${esc(t('tr_c_avg'))}</th><th>L</th>${P.type===1?'<th class="hide-m">L1</th><th class="hide-m">L2</th>':''}<th class="hide-m">${esc(t('tr_c_last'))}</th><th>${esc(t('tr_c_pct'))}</th><th class="l">${esc(t('tr_c_chart'))}</th></tr>`;
  const body=withN.map(({r,a},i)=>{
    const part = r.athPartial ? `<span class="pb" title="${esc(t('ath_partial'))}">6M</span>` : '';
    return `<tr><td class="dim">${i+1}</td><td class="l tok"><b>${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.symbol)}</a>`:esc(r.symbol)}</b><span>${esc(r.name||'')}</span></td>`+
      `<td class="l hide-m"><span class="cb">${esc(r.chainLabel||r.chain)}</span></td><td><span class="nbig">${a.n}</span></td>`+
      `<td class="hide-m"><div class="chips">${a.counted.map(x=>`<span>${x.len}d</span>`).join('')||'<span class="dim">—</span>'}</div></td>`+
      `<td class="hide-m">${a.avg!=null?a.avg.toFixed(0)+'d':'—'}</td><td>${a.L}d${part}</td>${P.type===1?`<td class="hide-m">${a.L1}d</td><td class="hide-m">${a.L2}d</td>`:''}`+
      `<td class="hide-m">${a.lastBreak!=null?a.lastBreak+'d':'—'}</td><td>${r.pctOfAth!=null?r.pctOfAth.toFixed(1)+'%':'—'}</td><td class="l">${mini(r,a)}</td></tr>`;
  }).join('');
  $('out').innerHTML=`<div class="tblbox"><table class="tbl">${head}${body}</table></div>`;
}
$('run').onclick=run;

if(!DATA || !DATA.rows || !DATA.rows.length){
  $('sub').textContent=t('tr_nodata'); $('run').disabled=true;
  $('out').innerHTML=`<div class="panel empty">${esc(t('tr_nodata'))}</div>`;
} else {
  $('sub').textContent=t('tr_sub',{n:DATA.rows.length, when:new Date(DATA.at).toLocaleString(LANG)});
  run();
}
</script>
</body>
</html>
