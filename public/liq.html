<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081426">
<link rel="icon" type="image/png" href="logo.png">
<title>Liquidity map · TopCat Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#081426; --panel:#0d1d36; --panel2:#132744; --line:#1f3657; --text:#e8f0fa; --muted:#8fa3bf;
  --accent:#0f6fd6; --good:#2fd39a; --warn:#fb923c; --blue:#5eb0ff;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans)}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
.wrap{max-width:1320px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:40px;height:40px;border-radius:10px}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
h1 small{display:block;font:500 13px var(--sans);color:var(--muted);letter-spacing:0;margin-top:2px}
.explain{color:var(--muted);font-size:13px;max-width:900px;margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;margin-bottom:18px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
@media (max-width:440px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px 12px}
.card.combined{border-color:#2c4c78}
.card h2{margin:0;font-size:16px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h2 a{font:500 12px var(--sans)}
.meta{color:var(--muted);font-size:12px;margin:3px 0 12px;font-family:var(--mono)}
.chart{display:flex;flex-direction:column;gap:3px}
.row{display:grid;grid-template-columns:132px 1fr 84px;align-items:center;gap:10px;min-height:30px;border-radius:6px;padding:0 4px}
.row:hover{background:var(--panel2)}
.zl{font:600 12px var(--mono);line-height:1.2}
.zl small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.track{height:16px;position:relative}
.bar{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:0}
.bar.buy{background:var(--good)} .bar.sell{background:var(--warn)}
.val{font:600 12px var(--mono);text-align:right;line-height:1.2}
.val small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.now{display:flex;align-items:center;gap:8px;margin:3px 0;color:var(--blue);font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.05em}
.now::before,.now::after{content:"";flex:1;height:0;border-top:1px dashed var(--blue);opacity:.7}
.state{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;color:var(--muted);text-align:center}
/* progresso: barra + % + tempo restante (a contar para trás) + passo atual */
.prog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.ptop{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.ppct{font:700 28px/1 var(--mono)}
.peta{font:600 14px var(--sans);color:#1fd1b2}
.pel{font-size:12px;color:var(--muted)}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:2%;background:linear-gradient(90deg,var(--accent),#1fd1b2);transition:width .4s}
.pmsg{margin-top:10px;font:500 12px var(--mono);color:var(--muted)}
.notes{color:var(--muted);font-size:12px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 12px;font:600 13px var(--sans)}
.btn:hover{text-decoration:none;border-color:#2c4c78}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="logo.png" alt=""><h1 id="title">Liquidity map<small id="sub"></small></h1></div>
    <a class="btn" href="./" id="back"></a>
  </header>
  <p class="explain" id="explain"></p>
  <div class="legend"><span><i style="background:var(--good)"></i><b id="lgBuy"></b></span><span><i style="background:var(--warn)"></i><b id="lgSell"></b></span></div>
  <div class="prog" id="prog" role="status" aria-live="polite">
    <div class="ptop"><span class="ppct" id="pPct">0%</span><span class="peta" id="pEta"></span><span class="pel" id="pEl"></span></div>
    <div class="pbar"><i id="pBar"></i></div>
    <div class="pmsg" id="pMsg"></div>
  </div>
  <div class="state" id="state" hidden></div>
  <div class="cards" id="cards"></div>
  <div class="notes" id="notes"></div>
</div>
<script src="i18n.js"></script>
<script>
// Mapa de liquidez: as 3 pools Uniswap V3/V4 com mais liquidez do token, em 10 zonas de preço.
const $=id=>document.getElementById(id);
const store={ get(k){ try{ return JSON.parse(localStorage.getItem('aths:'+k)); }catch{ return null; } } };
const Q=new URLSearchParams(location.search);
const LANG=['en','es','ru','zh','pt'].includes(Q.get('lang')||store.get('lang')) ? (Q.get('lang')||store.get('lang')) : 'en';
document.documentElement.lang = LANG==='zh'?'zh-CN':LANG;
function t(k,v){ let s=(I18N[LANG]&&I18N[LANG][k]) ?? I18N.en[k] ?? k; if(v) for(const [a,b] of Object.entries(v)) s=s.split('{'+a+'}').join(b); return s; }
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n){ if(n==null||!isFinite(n)) return '—'; if(n<1) return n>0?'<$1':'$0'; const u=[[1e9,'B'],[1e6,'M'],[1e3,'K']]; for(const [v,s] of u) if(n>=v){ const x=n/v; return '$'+(x>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(2))+s; } return '$'+n.toFixed(0); }
function price(n){ if(!(n>0)) return '—'; if(n>=1000) return '$'+n.toLocaleString('en',{maximumFractionDigits:0}); if(n>=1) return '$'+n.toFixed(n>=100?2:3);
  const z=Math.floor(-Math.log10(n)); if(z>=4){ const sub=String(z).split('').map(d=>'₀₁₂₃₄₅₆₇₈₉'[d]).join(''); return '$0.0'+sub+String(Math.round(n*10**(z+3))).slice(0,4); } return '$'+n.toPrecision(4); }
const mult=m=>{ if(m==null) return '∞'; let x=m<1?m.toFixed(m<0.3?3:2):m.toFixed(m<10?2:0); if(x.includes('.')) x=x.replace(/0+$/,'').replace(/\.$/,''); return x+'×'; };

const chain=Q.get('chain')||'', address=Q.get('address')||'', sym=Q.get('sym')||'', p=+Q.get('price')||0;
document.title = t('liq_title')+' · '+(sym||address.slice(0,8));
$('title').firstChild.textContent = t('liq_title')+' · '+(sym||'');
$('back').textContent='← '+t('liq_back');
$('explain').textContent=t('liq_explain');
$('lgBuy').textContent=t('liq_buy'); $('lgSell').textContent=t('liq_sell',{sym:sym||'token'});


function chartHtml(zones, Z, cur){
  const max=Math.max(...zones,0)||1, tot=zones.reduce((a,b)=>a+b,0)||1;
  let h='';
  for(let i=zones.length-1;i>=0;i--){
    const lo=Z[i], hi=Z[i+1], v=zones[i], buy=i<5;
    const range = i===0 ? '< '+mult(Z[1]) : hi==null ? '> '+mult(lo) : mult(lo)+'–'+mult(hi);
    const pr = i===0 ? '< '+price(cur*Z[1]) : hi==null ? '> '+price(cur*lo) : price(cur*lo)+'–'+price(cur*hi);
    const pct=v/tot*100;
    const tip=`${range} (${pr}): ${money(v)} · ${pct.toFixed(1)}% — ${buy?t('liq_buy'):t('liq_sell',{sym:sym||'token'})}`;
    h+=`<div class="row" title="${esc(tip)}"><div class="zl">${esc(range)}<small>${esc(pr)}</small></div>`+
       `<div class="track"><div class="bar ${buy?'buy':'sell'}" style="width:${v>0?Math.max(1.5,v/max*100):0}%"></div></div>`+
       `<div class="val">${esc(money(v))}<small>${pct>=0.05?pct.toFixed(1)+'%':'—'}</small></div></div>`;
    if(i===5) h+=`<div class="now">${esc(t('liq_now',{p:price(cur)}))}</div>`;
  }
  return `<div class="chart" role="table">${h}</div>`;
}

// Progresso: % do servidor + estimativa do tempo restante, que desce de segundo a segundo
const PR={t0:Date.now(),pct:0,eta:null,at:0,timer:null};
const fmtDur=s=>{ s=Math.max(0,Math.round(s)); if(s<60) return s+' '+t('u_s'); const m=Math.floor(s/60), r=s%60; return m+' '+t('u_min')+(r?' '+String(r).padStart(2,'0')+' '+t('u_s'):''); };
function progTick(){
  const el=(Date.now()-PR.t0)/1000;
  $('pPct').textContent=Math.round(PR.pct)+'%'; $('pBar').style.width=Math.max(2,PR.pct)+'%';
  $('pEl').textContent=t('p_elapsed',{t:fmtDur(el)});
  if(PR.eta==null) $('pEta').textContent=t('p_calc');
  else { const left=PR.eta-(Date.now()-PR.at)/1000; $('pEta').textContent = left>1 ? t('p_left',{t:fmtDur(left)}) : t('p_almost'); }
}
function progSet(pct,msg){
  pct=Math.max(PR.pct,Math.min(99,pct)); PR.pct=pct; if(msg) $('pMsg').textContent=msg;
  const el=(Date.now()-PR.t0)/1000;
  if(pct>=5 && el>=2){ const est=el*(100-pct)/pct; PR.eta = PR.eta==null ? est : PR.eta*0.6+est*0.4; PR.at=Date.now(); }
  progTick();
}
function progDone(){ clearInterval(PR.timer); $('prog').hidden=true; }
PR.timer=setInterval(progTick,1000); progTick(); $('pMsg').textContent=t('liq_loading');
async function streamMap(url){
  const r=await fetch(url);
  if(!/ndjson/.test(r.headers.get('content-type')||'')){ let d={}; try{ d=await r.json(); }catch(_){} throw new Error(d.error||('HTTP '+r.status)); }
  const reader=r.body.getReader(), dec=new TextDecoder(); let buf='', out=null;
  for(;;){ const {done,value}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
    let i; while((i=buf.indexOf('\n'))>=0){ const line=buf.slice(0,i); buf=buf.slice(i+1); if(!line.trim()) continue; const m=JSON.parse(line);
      if(m.type==='progress') progSet(m.pct, m.msg);
      else if(m.type==='error') throw new Error(m.msg);
      else if(m.type==='result') out=m.data; } }
  if(!out) throw new Error('no data');
  return out;
}

(async()=>{
  try{
    const qs=new URLSearchParams({chain,address,price:String(p||''),lang:LANG}); const key=store.get('key'); if(key) qs.set('apiKey',key);
    const d=await streamMap('api/liqmap?'+qs.toString());
    progDone();
    $('sub').textContent=t('liq_sub',{sym:sym||address, chain:d.chainLabel, p:price(d.price||p)});
    const cur=d.price||p;
    if(!d.pools.length){ $('state').hidden=false; $('state').textContent=t('liq_none'); return; }
    let cards='';
    if(d.pools.length>1){
      const comb=d.zones.slice(0,-1).map((_,i)=>d.pools.reduce((a,pl)=>a+(pl.zones[i]||0),0));
      cards+=`<section class="card combined"><h2>${esc(t('liq_combined',{n:d.pools.length}))}</h2><div class="meta">${esc(money(comb.reduce((a,b)=>a+b,0)))}</div>${chartHtml(comb,d.zones,cur)}</section>`;
    }
    for(const pl of d.pools){
      const meta=t('liq_pool_meta',{dex:pl.dex, fee:pl.fee!=null?pl.fee:'?', tvl:money(pl.tvl), n:pl.ticks});
      cards+=`<section class="card"><h2>${esc(pl.pair)}${pl.link?` <a href="${esc(pl.link)}" target="_blank" rel="noopener">${esc(t('liq_open'))} ↗</a>`:''}</h2><div class="meta">${esc(meta)}</div>${chartHtml(pl.zones,d.zones,cur)}</section>`;
    }
    $('cards').innerHTML=cards;
    if(d.notes && d.notes.length) $('notes').textContent=d.notes.join(' · ');
  }catch(e){ progDone(); $('state').hidden=false; $('state').textContent=t('liq_error',{e:e.message}); }
})();
</script>
</body>
</html>
